<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d20">
  <title>Starfire Circuit · MoeGPT</title>
  <link rel="stylesheet" href="style.css?v=starfire-circuit">
  <script defer src="i18n.js?v=starfire-circuit"></script>
  <script defer src="game.js?v=starfire-circuit"></script>
</head>
<body>
  <main id="app">
    <section id="home" class="home" aria-labelledby="title">
      <header class="brand">
        <span class="mark" aria-hidden="true">✦</span> MOEGPT
        <select id="language-select" data-label="语言" aria-label="Language">
          <option value="en" lang="en">English</option>
          <option value="zh-CN" lang="zh-CN">简体中文</option>
          <option value="ja" lang="ja">日本語</option>
        </select>
      </header>
      <div class="hero">
        <div class="portrait" id="portrait-stage">
          <div class="orbit" aria-hidden="true"></div>
          <div class="orbit orbit-inner" aria-hidden="true"></div>
          <div class="portrait-motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <img id="character-portrait" src="art/silver-dragon.webp" width="900" height="980" alt="ChatGPT · Silver Dragon">
          <span id="portrait-caption">Silver Dragon · ChatGPT</span>
        </div>
        <div class="intro">
          <h1 id="title" data-text="星火回路">Starfire Circuit</h1>
          <div id="character-select" class="character-select" role="group" data-label="选择出战角色" aria-label="Choose a character">
            <button type="button" data-character="chatgpt" aria-pressed="true">ChatGPT</button>
            <button type="button" data-character="claude" aria-pressed="false">Claude</button>
            <button type="button" data-character="deepseek" aria-pressed="false">DeepSeek</button>
            <button type="button" data-character="gemini" aria-pressed="false">Gemini</button>
            <button type="button" data-character="grok" aria-pressed="false">Grok</button>
          </div>
          <div class="weapon"><span class="weapon-icon"><img id="intro-weapon-icon" src="art/dragon.webp" alt=""></span><div><strong id="intro-weapon-name"></strong><p id="intro-weapon-description"></p></div></div>
          <p class="signature-note"><span id="intro-skill"></span><small id="intro-signature"></small></p>
          <div id="stage-select" class="stage-select" role="group" data-label="选择关卡" aria-label="Choose a stage">
            <button type="button" data-stage="0" aria-pressed="true"><strong>Broken Relay</strong><small>10 waves</small></button>
            <button type="button" data-stage="1" aria-pressed="false"><strong>Shattered Gallery</strong><small>15 waves</small></button>
            <button type="button" data-stage="2" aria-pressed="false"><strong>Astral Rift</strong><small>20 waves</small></button>
          </div>
          <button class="primary" id="start" data-text="开始防卫">Start Defense</button>
          <p class="controls-note" data-text="手机拖动摇杆 · 电脑 WASD / 方向键">Drag to move · WASD or arrow keys on desktop</p>
        </div>
      </div>
      <footer data-text="非官方同人作品 · 单人试玩">Unofficial fan game · Single-player demo</footer>
    </section>

    <section id="battle" class="battle" hidden data-label="防卫战" aria-label="Defense">
      <canvas id="arena" data-label="战斗画面" aria-label="Battlefield"></canvas>
      <header class="hud">
        <div class="status">
          <div class="status-line"><strong id="hud-character">ChatGPT</strong><span id="health-text">100 / 100</span></div>
          <div class="health"><i id="health-fill"></i></div>
          <div class="xp"><i id="xp-fill"></i></div>
          <div id="hud-level" class="hud-level">Lv.1 · 0/14 XP</div>
        </div>
        <div class="wave"><span id="wave-label">Wave 1 / 10</span><strong id="time">00:22</strong></div>
        <div class="utility"><span id="chips" class="chips" aria-label="0 chips"><img src="art/microchip.webp" alt=""><span id="chip-count">0</span></span><button id="pause" class="icon-button" data-label="暂停" aria-label="Pause">Ⅱ</button></div>
      </header>
      <div id="boss-hud" class="boss-hud" hidden>
        <div class="boss-status"><strong id="boss-name"></strong><span id="boss-phase-value"></span></div>
        <div id="boss-bars" class="boss-bars"></div>
      </div>
      <div id="wave-message" class="wave-message" aria-live="polite"></div>
      <div id="move-zone" class="move-zone" data-label="拖动移动" aria-label="Drag to move"></div>
      <div id="stick" class="stick" hidden aria-hidden="true"><i></i></div>
      <div id="gesture-tip" class="gesture-tip" data-text="在下半屏拖动以移动">Drag the lower half of the screen to move</div>
      <button type="button" id="skill-use" class="skill-use"><strong id="skill-name"></strong><small id="skill-status"></small></button>
      <div id="test-speed" class="test-speed" role="group" data-label="测试倍速" aria-label="Test speed" hidden>
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="2" aria-pressed="false">2×</button>
        <button type="button" data-speed="5" aria-pressed="false">5×</button>
      </div>
      <div id="overlay" class="overlay" hidden>
        <section class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
          <h2 id="panel-title"></h2>
          <div id="panel-body" class="panel-body">
            <p id="panel-description"></p>
            <div id="panel-details" hidden></div>
            <div id="offers" class="offers"></div>
          </div>
          <div id="panel-actions" class="panel-actions"></div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
